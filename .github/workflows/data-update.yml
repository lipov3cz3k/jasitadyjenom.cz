name: Data update

# Monthly: downloads boundaries (ČÚZK) and authorities with data boxes (RPP)
# and opens a PR with a new public/data/authorities.json if anything changed.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Update authority data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            data-pipeline/package-lock.json

      - run: npm ci
      - run: npm ci --prefix data-pipeline

      - name: Run pipeline
        run: npm run data:update 2>&1 | tee pipeline.log

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR opened with GITHUB_TOKEN doesn't trigger CI, so run the tests here
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test 2>&1 | tee test.log

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data/update-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/data
          git commit -m "Update authority data ($(date -u +%Y-%m-%d))"
          git push --force origin "$branch"

          {
            echo "Automated monthly update of ORP boundaries (ČÚZK) and authority data boxes (RPP)."
            echo
            echo "Tests (typecheck + vitest) passed in the **Data update** workflow. CI does not run"
            echo "on this PR by itself; close and reopen the PR to trigger it."
            echo
            echo "<details><summary>Pipeline output</summary>"
            echo
            echo '```'
            cat pipeline.log
            echo '```'
            echo "</details>"
          } > body.md

          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file body.md
          else
            gh pr create --head "$branch" --base main \
              --title "Update authority data $(date -u +%Y-%m)" --body-file body.md
          fi
