# Git hooks: `brew install pre-commit && pre-commit install`
# Update pinned revs: `pre-commit autoupdate --freeze`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20 # frozen: v1.109.4
    hooks:
      - id: terraform_fmt

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
